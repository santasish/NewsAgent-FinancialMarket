name: Daily market briefing

# Morning and evening are fired by `repository_dispatch`, not GitHub's native `schedule`
# trigger. GitHub's own docs say `schedule` runs are deprioritised under load with no
# timing guarantee at all, and two real runs on 2026-09-10/11 landed 4-5 hours late.
# `repository_dispatch` (and `workflow_dispatch`) go through the normal runner queue
# instead, so an external clock — a free cron service such as cron-job.org, configured
# to hit https://api.github.com/repos/<owner>/<repo>/dispatches with
# {"event_type": "run-morning"} / {"event_type": "run-evening"} at 6:30am / 6:30pm
# IST — is the actual scheduler now. See deploy/GITHUB_ACTIONS.md for the one-time setup.
#
# `schedule` is kept only for the weekly holiday-calendar refresh, which isn't
# time-sensitive, so its multi-hour slop doesn't matter.
on:
  repository_dispatch:
    types: [run-morning, run-evening]
  schedule:
    - cron: "30 20 * * 6"   # ~02:00 IST Sunday; holiday-calendar refresh only
  workflow_dispatch:
    inputs:
      edition:
        description: "Run manually: morning, evening, or refresh-holidays"
        required: true
        default: morning
        type: choice
        options: [morning, evening, refresh-holidays]

# The holiday-refresh job commits the updated calendar back to the repo.
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Three trigger shapes carry the edition differently: a manual run gives its own
      # choice in inputs.edition; the external cron's repository_dispatch call carries
      # it as the event_type ("run-morning"/"run-evening"), surfaced as github.event.action;
      # the one remaining native schedule is only ever the holiday refresh.
      - name: Pick the edition for this run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "EDITION=${{ inputs.edition }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            case "${{ github.event.action }}" in
              "run-morning") echo "EDITION=morning" >> "$GITHUB_ENV" ;;
              "run-evening") echo "EDITION=evening" >> "$GITHUB_ENV" ;;
              *) echo "unrecognised repository_dispatch type: ${{ github.event.action }}" >&2; exit 1 ;;
            esac
          else
            case "${{ github.event.schedule }}" in
              "30 20 * * 6") echo "EDITION=refresh-holidays" >> "$GITHUB_ENV" ;;
              *) echo "unrecognised schedule: ${{ github.event.schedule }}" >&2; exit 1 ;;
            esac
          fi
          echo "picked: $EDITION"

      - name: Generate and deliver the briefing
        if: env.EDITION == 'morning' || env.EDITION == 'evening'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m briefing.cli run --edition "$EDITION"

      # Kept for a week so a run can be inspected without digging through Telegram/email.
      - name: Save the issue as a build artifact
        if: always() && (env.EDITION == 'morning' || env.EDITION == 'evening')
        uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ env.EDITION }}-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

      # This runner is thrown away after the job, so without committing it back, the
      # evening run could never see which headlines this morning's run already used —
      # see briefing/dedup.py. A quiet day with nothing new produces no diff, and the
      # commit is skipped rather than failing on "nothing to commit".
      - name: Commit today's headline record
        if: always() && (env.EDITION == 'morning' || env.EDITION == 'evening')
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p state
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "Record ${EDITION} headlines for $(date -u +%F)" -q
            git push
          fi

      - name: Refresh the NSE holiday calendar
        if: env.EDITION == 'refresh-holidays'
        run: python -m briefing.cli refresh-holidays

      # The runner's checkout is thrown away after the job; without this, a refreshed
      # calendar never makes it back into the repo for the next run to read. Committing
      # here (even when nothing changed, via an empty commit) also counts as repository
      # activity, which keeps GitHub from auto-disabling the schedule after 60 quiet days.
      - name: Commit the refreshed calendar
        if: env.EDITION == 'refresh-holidays'
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add briefing/holidays.yaml
          git commit -m "Weekly holiday-calendar refresh" --allow-empty -q
          git push

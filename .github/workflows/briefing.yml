name: Daily market briefing

# Cron runs in UTC only; India Standard Time is UTC+5:30 with no daylight saving,
# so the offset here never drifts.
#
# GitHub deprioritises `schedule` runs under load, and load peaks exactly on the
# round minutes (:00, :30) that most other repos also use — see
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule.
# The morning/evening times below land a few minutes early on deliberately odd
# minutes to dodge that queue, not on the clean IST times a user would ask for.
# This is a best-effort mitigation, not a guarantee: GitHub's own docs are explicit
# that a `schedule` run can still be delayed by hours with no fixed upper bound. Two
# consecutive real runs on 2026-09-10/11 landed 4-5 hours late on the old :30 times.
#   ~6:23 IST -> 00:53 UTC  (morning edition, target 6:30 IST)
#   ~19:53 IST -> 14:23 UTC (evening edition, target 20:00 IST)
#   02:00 IST Sunday -> 20:30 UTC Saturday (holiday-calendar refresh; not time-sensitive)
on:
  schedule:
    - cron: "53 0 * * *"
    - cron: "23 14 * * *"
    - cron: "30 20 * * 6"
  workflow_dispatch:
    inputs:
      edition:
        description: "Run manually: morning, evening, or refresh-holidays"
        required: true
        default: morning
        type: choice
        options: [morning, evening, refresh-holidays]

# The holiday-refresh job commits the updated calendar back to the repo.
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Scheduled runs don't say in plain text which cron fired; map it to an edition.
      # A manual run carries its own choice in github.event.inputs.edition instead.
      - name: Pick the edition for this run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "EDITION=${{ inputs.edition }}" >> "$GITHUB_ENV"
          else
            case "${{ github.event.schedule }}" in
              "53 0 * * *")  echo "EDITION=morning" >> "$GITHUB_ENV" ;;
              "23 14 * * *") echo "EDITION=evening" >> "$GITHUB_ENV" ;;
              "30 20 * * 6") echo "EDITION=refresh-holidays" >> "$GITHUB_ENV" ;;
              *) echo "unrecognised schedule: ${{ github.event.schedule }}" >&2; exit 1 ;;
            esac
          fi
          echo "picked: $EDITION"

      - name: Generate and deliver the briefing
        if: env.EDITION == 'morning' || env.EDITION == 'evening'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m briefing.cli run --edition "$EDITION"

      # Kept for a week so a run can be inspected without digging through Telegram/email.
      - name: Save the issue as a build artifact
        if: always() && (env.EDITION == 'morning' || env.EDITION == 'evening')
        uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ env.EDITION }}-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

      # This runner is thrown away after the job, so without committing it back, the
      # evening run could never see which headlines this morning's run already used —
      # see briefing/dedup.py. A quiet day with nothing new produces no diff, and the
      # commit is skipped rather than failing on "nothing to commit".
      - name: Commit today's headline record
        if: always() && (env.EDITION == 'morning' || env.EDITION == 'evening')
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p state
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "Record ${EDITION} headlines for $(date -u +%F)" -q
            git push
          fi

      - name: Refresh the NSE holiday calendar
        if: env.EDITION == 'refresh-holidays'
        run: python -m briefing.cli refresh-holidays

      # The runner's checkout is thrown away after the job; without this, a refreshed
      # calendar never makes it back into the repo for the next run to read. Committing
      # here (even when nothing changed, via an empty commit) also counts as repository
      # activity, which keeps GitHub from auto-disabling the schedule after 60 quiet days.
      - name: Commit the refreshed calendar
        if: env.EDITION == 'refresh-holidays'
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add briefing/holidays.yaml
          git commit -m "Weekly holiday-calendar refresh" --allow-empty -q
          git push
